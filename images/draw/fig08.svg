orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7fb8ff"/></marker><marker id="mT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e9f0ec"/></marker></defs><rect width="640" height="300" fill="#14221c"/><text x="30" y="44" class="bold" font-size="20" >繼電器模組</text><rect x="30" y="70" width="170" height="86" rx="10" fill="#1b2c25" stroke="#e9f0ec" stroke-width="2" /><text x="115" y="109" class="c bold" font-size="20" >COM</text><text x="115" y="131" class="c m" font-size="13" >電進來</text><rect x="235" y="70" width="170" height="86" rx="10" fill="rgba(127,214,164,.08)" stroke="#7fd6a4" stroke-width="2.5" /><text x="320" y="109" class="c bold e" font-size="18" >NO（常開）</text><text x="320" y="131" class="c m" font-size="13" >電出去 ✓</text><rect x="440" y="70" width="170" height="86" rx="10" fill="#14221c" stroke="#7d9087" stroke-width="2" stroke-dasharray="6 5"/><text x="525" y="109" class="c bold f" font-size="18" >NC（常閉）</text><text x="525" y="131" class="c m" font-size="13" >不使用 ✗</text><text x="30" y="200" font-size="15" >12 V 先經手動開關，再從 COM 進來、NO 出去接升壓模組</text><text x="30" y="232" class="m" font-size="14" >另有 VCC／GND／IN 三支小針腳接 Arduino</text><text x="30" y="270" class="a" font-size="14" >故障安全：線圈失電 → 簧片彈回 → NO 斷開 → 高壓自動關閉</text></svg>